<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1104 322" width="1104" height="322" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e5496"/></marker></defs>
  <rect x="6" y="20" width="300" height="120" rx="10" fill="#cceef9" stroke="#00a9e0" stroke-width="2.5"/>
  <text x="156.0" y="54" font-size="18" fill="#111" font-weight="bold" font-style="normal" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace">read_wave(path)</text>
  <text x="156.0" y="90" font-size="19" fill="#444" font-weight="normal" font-style="normal" text-anchor="middle">read one wave file</text>
  <text x="156.0" y="116" font-size="19" fill="#444" font-weight="normal" font-style="normal" text-anchor="middle">into a list of pairs</text>
  <line x1="309" y1="80" x2="399" y2="80" stroke="#3e5496" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="402" y="20" width="300" height="120" rx="10" fill="#a6e1f4" stroke="#3e5496" stroke-width="2.5"/>
  <text x="552.0" y="54" font-size="18" fill="#111" font-weight="bold" font-style="normal" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace">link_waves(w1, w2)</text>
  <text x="552.0" y="90" font-size="19" fill="#444" font-weight="normal" font-style="normal" text-anchor="middle">pair the answers of</text>
  <text x="552.0" y="116" font-size="19" fill="#444" font-weight="normal" font-style="normal" text-anchor="middle">the people in both waves</text>
  <line x1="705" y1="80" x2="795" y2="80" stroke="#3e5496" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="798" y="20" width="300" height="120" rx="10" fill="#cceef9" stroke="#00a9e0" stroke-width="2.5"/>
  <text x="948.0" y="54" font-size="18" fill="#111" font-weight="bold" font-style="normal" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace">report(pairs)</text>
  <text x="948.0" y="90" font-size="19" fill="#444" font-weight="normal" font-style="normal" text-anchor="middle">how many changed</text>
  <text x="948.0" y="116" font-size="19" fill="#444" font-weight="normal" font-style="normal" text-anchor="middle">their answer</text>
  <text x="196.0" y="172" font-size="18" fill="#3e5496" font-weight="normal" font-style="italic" text-anchor="middle">2 lists of (email, answer)</text>
  <text x="908.0" y="172" font-size="18" fill="#3e5496" font-weight="normal" font-style="italic" text-anchor="middle">dict: pseudonym → pair</text>
  <line x1="552.0" y1="214" x2="552.0" y2="143" stroke="#3e5496" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="560.0" y="192" font-size="17" fill="#3e5496" font-weight="normal" font-style="italic" text-anchor="start">uses</text>
  <rect x="412" y="216" width="280" height="100" rx="10" fill="#cceef9" stroke="#00a9e0" stroke-width="2.5"/>
  <text x="552.0" y="248" font-size="18" fill="#111" font-weight="bold" font-style="normal" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace">pseudonym(email)</text>
  <text x="552.0" y="278" font-size="18" fill="#444" font-weight="normal" font-style="normal" text-anchor="middle">clean the email, then a</text>
  <text x="552.0" y="302" font-size="18" fill="#444" font-weight="normal" font-style="normal" text-anchor="middle">hash with a secret (session 3)</text>
  <text x="948.0" y="272" font-size="18" fill="#3e5496" font-weight="normal" font-style="italic" text-anchor="middle">link_waves is specified and</text>
  <text x="948.0" y="296" font-size="18" fill="#3e5496" font-weight="normal" font-style="italic" text-anchor="middle">tested in the next sections</text>
</svg>
