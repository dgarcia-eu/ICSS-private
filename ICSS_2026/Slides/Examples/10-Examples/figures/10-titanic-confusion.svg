<svg xmlns="http://www.w3.org/2000/svg" viewBox="14.4 9.3 806.5 204.8" width="806" height="205" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<text x="20" y="26" font-size="15" text-anchor="start" fill="#333333" font-weight="bold" font-style="normal">rule: predict 'survived' if and only if the passenger is a woman</text>
<rect x="180" y="45" width="130" height="30" rx="4" fill="#e5e5e5" stroke="#999999" stroke-width="1.5"/>
<text x="245" y="66" font-size="13" text-anchor="middle" fill="#666666" font-weight="normal" font-style="normal">predicted: yes</text>
<rect x="320" y="45" width="130" height="30" rx="4" fill="#e5e5e5" stroke="#999999" stroke-width="1.5"/>
<text x="385" y="66" font-size="13" text-anchor="middle" fill="#666666" font-weight="normal" font-style="normal">predicted: no</text>
<rect x="40" y="85" width="130" height="40" rx="4" fill="#e5e5e5" stroke="#999999" stroke-width="1.5"/>
<text x="105" y="110" font-size="13" text-anchor="middle" fill="#666666" font-weight="normal" font-style="normal">survived</text>
<rect x="40" y="135" width="130" height="40" rx="4" fill="#e5e5e5" stroke="#999999" stroke-width="1.5"/>
<text x="105" y="160" font-size="13" text-anchor="middle" fill="#666666" font-weight="normal" font-style="normal">died</text>
<rect x="180" y="85" width="130" height="40" rx="4" fill="#e0f3ec" stroke="#0a9086" stroke-width="1.5"/>
<text x="245" y="110" font-size="15" text-anchor="middle" fill="#333333" font-weight="normal" font-style="normal">TP = 233</text>
<rect x="320" y="85" width="130" height="40" rx="4" fill="#fde2e2" stroke="#8e2043" stroke-width="1.5"/>
<text x="385" y="110" font-size="15" text-anchor="middle" fill="#333333" font-weight="normal" font-style="normal">FN = 109</text>
<rect x="180" y="135" width="130" height="40" rx="4" fill="#fde2e2" stroke="#8e2043" stroke-width="1.5"/>
<text x="245" y="160" font-size="15" text-anchor="middle" fill="#333333" font-weight="normal" font-style="normal">FP = 81</text>
<rect x="320" y="135" width="130" height="40" rx="4" fill="#e0f3ec" stroke="#0a9086" stroke-width="1.5"/>
<text x="385" y="160" font-size="15" text-anchor="middle" fill="#333333" font-weight="normal" font-style="normal">TN = 468</text>
<text x="490" y="100" font-size="15" text-anchor="start" fill="#333333" font-weight="normal" font-style="normal" font-family="DejaVu Sans Mono, Menlo, monospace">accuracy  = (233 + 468) / 891 = 78.7%</text>
<text x="490" y="128" font-size="15" text-anchor="start" fill="#333333" font-weight="normal" font-style="normal" font-family="DejaVu Sans Mono, Menlo, monospace">precision = 233 / (233 + 81) = 0.74</text>
<text x="490" y="156" font-size="15" text-anchor="start" fill="#333333" font-weight="normal" font-style="normal" font-family="DejaVu Sans Mono, Menlo, monospace">recall    = 233 / (233 + 109) = 0.68</text>
<text x="20" y="205" font-size="14" text-anchor="start" fill="#3e5496" font-weight="bold" font-style="normal">a one-feature rule that a human could state in five words gets 79%: the baseline every model must beat</text>
</svg>
