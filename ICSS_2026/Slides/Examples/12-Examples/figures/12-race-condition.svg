<svg xmlns="http://www.w3.org/2000/svg" viewBox="14.2 7.2 862.9 265.8" width="863" height="266" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<text x="20" y="24" font-size="15" text-anchor="start" fill="#666666" font-weight="normal" font-style="normal">two threads, both running:   counter ← counter + 1   (really: read, add, write)</text>
<text x="20" y="82" font-size="15" text-anchor="start" fill="#333333" font-weight="bold" font-style="normal">thread A</text>
<rect x="120" y="60" width="115" height="34" rx="5" fill="#fff" stroke="#999999" stroke-width="1.5"/>
<text x="177" y="83" font-size="13" text-anchor="middle" fill="#333333" font-weight="normal" font-style="normal" font-family="DejaVu Sans Mono, Menlo, monospace">read 41</text>
<rect x="370" y="60" width="115" height="34" rx="5" fill="#fff" stroke="#999999" stroke-width="1.5"/>
<text x="427" y="83" font-size="13" text-anchor="middle" fill="#333333" font-weight="normal" font-style="normal" font-family="DejaVu Sans Mono, Menlo, monospace">add 1 → 42</text>
<rect x="620" y="60" width="115" height="34" rx="5" fill="#fde2e2" stroke="#8e2043" stroke-width="1.5"/>
<text x="677" y="83" font-size="13" text-anchor="middle" fill="#333333" font-weight="normal" font-style="normal" font-family="DejaVu Sans Mono, Menlo, monospace">write 42</text>
<text x="20" y="142" font-size="15" text-anchor="start" fill="#333333" font-weight="bold" font-style="normal">thread B</text>
<rect x="245" y="120" width="115" height="34" rx="5" fill="#fff" stroke="#999999" stroke-width="1.5"/>
<text x="302" y="143" font-size="13" text-anchor="middle" fill="#333333" font-weight="normal" font-style="normal" font-family="DejaVu Sans Mono, Menlo, monospace">read 41</text>
<rect x="495" y="120" width="115" height="34" rx="5" fill="#fff" stroke="#999999" stroke-width="1.5"/>
<text x="552" y="143" font-size="13" text-anchor="middle" fill="#333333" font-weight="normal" font-style="normal" font-family="DejaVu Sans Mono, Menlo, monospace">add 1 → 42</text>
<rect x="745" y="120" width="115" height="34" rx="5" fill="#fde2e2" stroke="#8e2043" stroke-width="1.5"/>
<text x="802" y="143" font-size="13" text-anchor="middle" fill="#333333" font-weight="normal" font-style="normal" font-family="DejaVu Sans Mono, Menlo, monospace">write 42</text>
<line x1="120" y1="185" x2="870" y2="185" stroke="#666666" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="495" y="205" font-size="13" text-anchor="middle" fill="#666666" font-weight="normal" font-style="normal">time →</text>
<text x="20" y="240" font-size="15" text-anchor="start" fill="#8e2043" font-weight="bold" font-style="normal">two increments happened, the counter went from 41 to 42: one update is lost</text>
<text x="20" y="264" font-size="14" text-anchor="start" fill="#666666" font-weight="normal" font-style="normal">neither thread has a bug: the bug is in the interleaving, which no single program shows</text>
</svg>
