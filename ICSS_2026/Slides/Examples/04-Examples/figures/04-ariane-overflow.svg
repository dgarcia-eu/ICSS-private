<svg xmlns="http://www.w3.org/2000/svg" viewBox="13.3 9.2 781.3 245.0" width="781" height="245" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<text x="20" y="26" font-size="15" text-anchor="start" fill="#666666" font-weight="normal" font-style="normal">horizontal velocity (BH), as computed</text>
<rect x="20" y="40" width="420" height="40" rx="6" fill="#fff" stroke="#333333" stroke-width="1.5"/>
<text x="230" y="67" font-size="17" text-anchor="middle" fill="#333333" font-weight="normal" font-style="normal">64-bit float</text>
<text x="450" y="67" font-size="14" text-anchor="start" fill="#666666" font-weight="normal" font-style="normal">e.g. 3.6 × 10⁴, five times what Ariane 4 ever reached</text>
<line x1="230" y1="88" x2="230" y2="128" stroke="#333333" stroke-width="2" marker-end="url(#ar)"/>
<text x="250" y="112" font-size="14" text-anchor="start" fill="#666666" font-weight="normal" font-style="normal">convert, so the value fits the old alignment code</text>
<rect x="150" y="135" width="160" height="40" rx="6" fill="#fff" stroke="#333333" stroke-width="1.5"/>
<text x="230" y="162" font-size="17" text-anchor="middle" fill="#333333" font-weight="normal" font-style="normal">16-bit integer</text>
<text x="330" y="162" font-size="14" text-anchor="start" fill="#666666" font-weight="normal" font-style="normal">range −32 768 … 32 767</text>
<text x="20" y="215" font-size="15" text-anchor="start" fill="#8e2043" font-weight="normal" font-style="normal">36 000 does not fit → operand error → exception not handled → unit shuts down</text>
<text x="20" y="245" font-size="15" text-anchor="start" fill="#8e2043" font-weight="normal" font-style="normal">backup unit runs the same code → same error, 72 ms later → no attitude data → self-destruct at T+37 s</text>
</svg>
